[project]
name = "micro-cti"
version = "0.1.0"
description = "OSINT app for collecting cybersecurity threat intelligence from microblogging platforms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "atproto>=0.0.73",
    "beautifulsoup4>=4.15.0",
    "dictature>=1.2.0",
    "fastapi[standard]>=0.162.0",
    "feedparser>=6.0.14",
    "fuzzywuzzy[speedup]>=0.18.0",
    "lark>=1.3.1",
    "markdown>=3.11.2",
    "mastodon-py>=2.3.3",
    "openai>=3.37.0",
    "pyairtable>=3.5.0",
    "pydantic-ai>=2.61.0",
    "pydantic-ai-slim[mistral]>=2.61.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "telethon>=1.45.0",
    "tomli-w>=1.2.0",
]
